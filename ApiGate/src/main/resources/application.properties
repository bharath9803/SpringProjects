spring.application.name=ApiGate
# Set the port for the API Gateway
server.port=8085

# Enable service discovery if using Eureka
spring.cloud.discovery.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8787/eureka/
spring.cloud.netflix.eureka.discovery.enabled=true
# Gateway routes
spring.cloud.gateway.routes[0].id=Order
spring.cloud.gateway.routes[0].uri=lb://ORDER
spring.cloud.gateway.routes[0].predicates[0]=Path=/order/**

spring.cloud.gateway.routes[1].id=Product
spring.cloud.gateway.routes[1].uri=lb://PRODUCT
spring.cloud.gateway.routes[1].predicates[0]=Path=/product/**
