<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <style>
        /* Apply Inter font to the body */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f2f5; /* Light gray background */
        }
        /* Custom message box styling */
        .message-box {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 1rem 1.5rem;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            display: none; /* Hidden by default */
            animation: fadeIn 0.3s ease-out;
        }
        .message-box.success {
            background-color: #d4edda; /* Light green */
            color: #155724; /* Dark green text */
            border: 1px solid #c3e6cb;
        }
        .message-box.error {
            background-color: #f8d7da; /* Light red */
            color: #721c24; /* Dark red text */
            border: 1px solid #f5c6cb;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeOut {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(-20px); }
        }
        .message-box.hide {
            animation: fadeOut 0.3s ease-in forwards;
        }
    </style>
</head>
<body class="p-4">
    <div class="container mx-auto max-w-4xl mt-8">
        <h1 class="text-4xl font-bold text-center text-gray-800 mb-8 flex items-center justify-center">
            <i class="fas fa-clipboard-list mr-3 text-blue-600"></i> Order Management
        </h1>
        
        <div id="customMessageBox" class="message-box"></div>

        <div class="bg-white shadow-lg rounded-lg p-6 mb-8">
            <div class="border-b pb-4 mb-4">
                <h2 class="text-2xl font-semibold text-gray-700 flex items-center">
                    <i class="fas fa-cart-plus mr-2 text-green-600"></i> Place an Order
                </h2>
            </div>
            <form id="orderForm" class="space-y-4">
                <div class="flex flex-col">
                    <label for="productId" class="text-gray-600 font-medium mb-1">Product ID</label>
                    <input type="number" class="form-input p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400" id="productId" required>
                </div>
                <div class="flex flex-col">
                    <label for="quantity" class="text-gray-600 font-medium mb-1">Quantity</label>
                    <input type="number" class="form-input p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400" id="quantity" required>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-md shadow-md transition duration-300 ease-in-out flex items-center justify-center">
                    <i class="fas fa-paper-plane mr-2"></i> Place Order
                </button>
            </form>
        </div>

        <div class="bg-white shadow-lg rounded-lg p-6">
            <div class="border-b pb-4 mb-4">
                <h2 class="text-2xl font-semibold text-gray-700 flex items-center">
                    <i class="fas fa-table mr-2 text-purple-600"></i> Existing Orders
                </h2>
            </div>
            <div class="overflow-x-auto">
                <table class="min-w-full bg-white border border-gray-200 rounded-lg" id="ordersTable">
                    <thead>
                        <tr class="bg-gray-100 text-gray-600 uppercase text-sm leading-normal">
                            <th class="py-3 px-6 text-left border-b border-gray-200 rounded-tl-lg">Order ID</th>
                            <th class="py-3 px-6 text-left border-b border-gray-200">Product ID</th>
                            <th class="py-3 px-6 text-left border-b border-gray-200">Quantity</th>
                            <th class="py-3 px-6 text-left border-b border-gray-200">Product Name</th>
                            <th class="py-3 px-6 text-left border-b border-gray-200">Product Price</th>
                            <th class="py-3 px-6 text-left border-b border-gray-200 rounded-tr-lg">Total Price</th>
                        </tr>
                    </thead>
                    <tbody class="text-gray-700 text-sm font-light">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Function to display custom messages (replaces alert())
        function showMessage(message, type = 'success') {
            const messageBox = $('#customMessageBox');
            messageBox.text(message);
            messageBox.removeClass('success error hide').addClass(type).show();

            // Automatically hide after 3 seconds
            setTimeout(() => {
                messageBox.addClass('hide');
                setTimeout(() => messageBox.hide(), 300); // Fully hide after animation
            }, 3000);
        }

        // Function to place an order
        $('#orderForm').submit(function(event) {
            event.preventDefault();
            const productId = $('#productId').val();
            const quantity = $('#quantity').val();

            $.ajax({
                url: 'http://localhost:8085/order/PlaceOrder',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ productId, quantity }),
                success: function(response) {
                    showMessage('Order placed successfully!', 'success'); // Use custom message box
                    fetchOrders();
                },
                error: function(xhr, status, error) {
                    showMessage('Error placing order: ' + (xhr.responseJSON ? xhr.responseJSON.message : error), 'error'); // Use custom message box
                }
            });
        });

        // Function to fetch existing orders
        function fetchOrders() {
            $.ajax({
                url: 'http://localhost:8085/order/viewOrder',
                type: 'GET',
                success: function(response) {
                    const ordersTable = $('#ordersTable tbody');
                    ordersTable.empty();
                    // Ensure response is an array before iterating
                    if (Array.isArray(response)) {
                        response.forEach(order => {
                            ordersTable.append(`
                                <tr class="border-b border-gray-200 hover:bg-gray-50">
                                    <td class="py-3 px-6 text-left whitespace-nowrap">${order.orderId}</td>
                                    <td class="py-3 px-6 text-left">${order.productId}</td>
                                    <td class="py-3 px-6 text-left">${order.quantity}</td>
                                    <td class="py-3 px-6 text-left">${order.productName || 'N/A'}</td>
                                    <td class="py-3 px-6 text-left">${order.productPrice || 'N/A'}</td>
                                    <td class="py-3 px-6 text-left">${order.totalPrice || 'N/A'}</td>
                                </tr>
                            `);
                        });
                    } else {
                        showMessage('Error: Unexpected response format for orders.', 'error');
                        console.error('Expected an array for orders, but received:', response);
                    }
                },
                error: function(xhr, status, error) {
                    showMessage('Error fetching orders: ' + (xhr.responseJSON ? xhr.responseJSON.message : error), 'error'); // Use custom message box
                }
            });
        }

        // Fetch orders on page load
        $(document).ready(function() {
            fetchOrders();
        });
    </script>
</body>
</html>
